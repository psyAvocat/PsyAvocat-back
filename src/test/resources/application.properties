spring.application.name=psyAvocat-test

# H2 in-memory DB for tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

firebase.project-id=psyavocat-test
firebase.credentials.path=
cors.allowed-origins=http://localhost:4200,http://localhost:3000,http://localhost:5000
