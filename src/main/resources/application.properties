spring.application.name=psyAvocat


# ==========================================
# DATABASE
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/psyavocat_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:GENIUS2024!!}

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# SERVER
# ==========================================

server.port=8080

# ==========================================
# FIREBASE & CORS
# ==========================================

firebase.project-id=psyavocat
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:5000}

# ==========================================
# ADMIN BOOTSTRAP (désactivé par défaut)
# ==========================================
# Pour activer : passer à true le temps d'un seul démarrage
# puis remettre à false immédiatement après.
# Les valeurs sont lues depuis des variables d'environnement :
#   PSYAVOCAT_ADMIN_FIREBASE_UID  → UID Firebase du compte admin
#   PSYAVOCAT_ADMIN_EMAIL         → Email du compte admin Firebase
#   PSYAVOCAT_ADMIN_NOM           → Nom de famille de l'admin
#   PSYAVOCAT_ADMIN_PRENOM        → Prénom de l'admin
# ==========================================
psyavocat.admin.bootstrap.enabled=${PSYAVOCAT_ADMIN_BOOTSTRAP:}
psyavocat.admin.firebase-uid=${PSYAVOCAT_ADMIN_FIREBASE_UID:}
psyavocat.admin.email=${PSYAVOCAT_ADMIN_EMAIL:}
psyavocat.admin.nom=${PSYAVOCAT_ADMIN_NOM:}
psyavocat.admin.prenom=${PSYAVOCAT_ADMIN_PRENOM:}

# ==========================================
# CLOUDINARY (Médias visuels publics - Photos/Avatars)
# ==========================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ==========================================
# CLOUDFLARE R2 (Documents privés sensibles S3-compatible)
# ==========================================
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.bucket-name=${R2_BUCKET_NAME:}
r2.endpoint=${R2_ENDPOINT:}
r2.presigned-url-expiration-minutes=${R2_PRESIGNED_EXPIRATION:15}

