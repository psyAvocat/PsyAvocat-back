spring.application.name=psyAvocat

# Chargement automatique et optionnel du fichier local .env (non versionné)
spring.config.import=optional:file:./.env[.properties]


# ==========================================
# DATABASE
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/psyavocat_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
# Secret : à définir dans le fichier local .env (non versionné) ou l'environnement.
spring.datasource.password=${DB_PASSWORD:}

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# SERVER
# ==========================================

server.port=8080
server.address=0.0.0.0

# Envois de fichiers : alignés sur les limites métier (images 5 Mo, documents 10 Mo).
# Sans ces valeurs, Spring refuse tout fichier de plus de 1 Mo.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ==========================================
# FIREBASE & CORS
# ==========================================

firebase.project-id=psyavocat
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
# Motifs acceptés (ports quelconques en local : Angular, Flutter Web). En production,
# fixer CORS_ALLOWED_ORIGINS sur les domaines réels (ex. https://app.psyavocat.com).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# ==========================================
# ADMIN BOOTSTRAP (UID Firebase et e-mail réels fournis par le .env local)
# Sans UID ni e-mail, aucun administrateur n'est créé.
# ==========================================
psyavocat.admin.bootstrap.enabled=${PSYAVOCAT_ADMIN_BOOTSTRAP:true}
psyavocat.admin.firebase-uid=${PSYAVOCAT_ADMIN_FIREBASE_UID:}
psyavocat.admin.email=${PSYAVOCAT_ADMIN_EMAIL:}
psyavocat.admin.nom=${PSYAVOCAT_ADMIN_NOM:}
psyavocat.admin.prenom=${PSYAVOCAT_ADMIN_PRENOM:}

# ==========================================
# CLOUDFLARE R2 (Stockage Médias et Documents)
# ==========================================
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.endpoint=${R2_ENDPOINT:}
r2.media-bucket=${R2_MEDIA_BUCKET:psyavocat-media}
r2.documents-bucket=${R2_DOCUMENTS_BUCKET:psyavocat-documents}
r2.presigned-expiration=${R2_PRESIGNED_EXPIRATION:15}
r2.presigned-url-expiration-minutes=${R2_PRESIGNED_EXPIRATION:15}

# ==========================================
# VISIOCONFÉRENCE (salles Jitsi Meet des rendez-vous en visio)
# ==========================================
# Serveur Jitsi : meet.ffmuc.net n'exige pas de compte pour ouvrir une salle (meet.jit.si, si).
# En production, un serveur Jitsi dédié est recommandé.
psyavocat.visio.url=${VISIO_URL:https://meet.ffmuc.net}


